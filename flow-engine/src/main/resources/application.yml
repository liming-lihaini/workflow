server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: flow-engine
  datasource:
    driver-class-name: org.sqlite.JDBC
    # busy_timeout: 写锁等待，避免 webhook 异步回调与主流程事务并发写入时出现 SQLITE_BUSY
    # journal_mode=WAL: 读写可并发，减少写写冲突
    url: jdbc:sqlite:flow_engine.db?busy_timeout=10000&journal_mode=WAL&synchronous=NORMAL
    username:
    password:
  # 启动时自动执行建表脚本（TRD §2.1，19 张表）
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      continue-on-error: true
  # 未匹配到 Handler 时抛出异常，交由全局异常处理器返回统一 404
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # 本地缓存（TRD §5.4，Caffeine）
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=1h
  # 附件上传大小限制（AttachmentController）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
