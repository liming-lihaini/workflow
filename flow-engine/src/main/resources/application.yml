server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: flow-engine
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 8.0 数据源（替代 SQLite）
    url: jdbc:mysql://127.0.0.1:3306/flow_engine?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  # 启动时自动执行建表脚本（MySQL 8.0 语法）
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema_mysql.sql
      continue-on-error: true
  # 未匹配到 Handler 时抛出异常，交由全局异常处理器返回统一 404
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # 本地缓存（TRD §5.4，Caffeine）
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=1h
  # 附件上传大小限制（AttachmentController）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
